spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ecommerce
    username: ${name}
    password: ${password}

# SpringDoc 配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 商家身份（临时）：登录模块完成前，用它代表当前商家
app:
  merchant:
    dev-merchant-id: 3